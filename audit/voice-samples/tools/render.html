<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>voice-samples render</title>
</head>
<body>
<pre id="log">ready</pre>
<script src="../samples.js"></script>
<script>
(function () {
  'use strict';
  var S = window.ESCAPE.VOICE_SAMPLES;
  var SR = 48000;
  var T0 = 0.02;          /* 頭の余白（レンダ開始から音を出すまで） */
  var PAD = 2.00;         /* 尾を取りこぼさない余白（P4.15 の残響テールに合わせて延長） */
  var FLOOR = 0.0008;     /* この振幅を下回ったら「鳴り終わり」 */

  function offline(sec) {
    var C = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    return new C(2, Math.ceil(SR * sec), SR);
  }

  /** 1案をレンダして AudioBuffer を返す。useNorm=false で較正用（norm を掛けない） */
  function render(item, useNorm) {
    var sec = item.dur + T0 + PAD;
    var ctx = offline(sec);
    var master = ctx.createGain();
    master.gain.value = S.MASTER;
    master.connect(ctx.destination);
    S.build(ctx, master, T0, item, useNorm);
    return ctx.startRendering();
  }

  function analyze(buf) {
    var L = buf.getChannelData(0), R = buf.getChannelData(1);
    var n = buf.length, i, a, peak = 0;
    var s0 = Math.round(T0 * SR);
    for (i = s0; i < n; i++) {
      a = Math.abs(L[i]); if (a > peak) peak = a;
      a = Math.abs(R[i]); if (a > peak) peak = a;
    }
    /* 立ち上がり: ピークの50%に最初に届いた時刻 */
    var half = peak * 0.5, t50 = -1;
    for (i = s0; i < n; i++) {
      if (Math.abs(L[i]) >= half || Math.abs(R[i]) >= half) { t50 = (i - s0) / SR; break; }
    }
    /* 持続長: ピークの2%(-34dB)を最後に上回った時刻 */
    var th = peak * 0.02, tEnd = 0, j;
    for (j = n - 1; j >= s0; j--) {
      if (Math.abs(L[j]) >= th || Math.abs(R[j]) >= th) { tEnd = (j - s0) / SR; break; }
    }
    /* WAV の切り出し末尾: 完全に無音になる点 */
    var cut = n - 1;
    for (j = n - 1; j >= s0; j--) {
      if (Math.abs(L[j]) >= FLOOR || Math.abs(R[j]) >= FLOOR) { cut = j; break; }
    }
    cut = Math.min(n - 1, cut + Math.round(0.05 * SR));
    return { peak: peak, t50: t50, dur: tEnd, s0: s0, cut: cut };
  }

  function encodeWav(buf, s0, s1) {
    var L = buf.getChannelData(0), R = buf.getChannelData(1);
    var n = s1 - s0 + 1;
    var bytes = 44 + n * 4;
    var ab = new ArrayBuffer(bytes);
    var v = new DataView(ab);
    function str(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0, 'RIFF'); v.setUint32(4, bytes - 8, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);            /* PCM */
    v.setUint16(22, 2, true);            /* 2ch */
    v.setUint32(24, SR, true);
    v.setUint32(28, SR * 4, true);       /* byte rate */
    v.setUint16(32, 4, true);            /* block align */
    v.setUint16(34, 16, true);           /* 16bit */
    str(36, 'data'); v.setUint32(40, n * 4, true);
    var o = 44;
    for (var i = 0; i < n; i++) {
      var l = Math.max(-1, Math.min(1, L[s0 + i]));
      var r = Math.max(-1, Math.min(1, R[s0 + i]));
      v.setInt16(o, l < 0 ? l * 0x8000 : l * 0x7FFF, true); o += 2;
      v.setInt16(o, r < 0 ? r * 0x8000 : r * 0x7FFF, true); o += 2;
    }
    return ab;
  }

  /** 較正: norm を掛けずにレンダして、狙いのピークに載せる norm を返す */
  window.__CALIBRATE = function (ids) {
    var out = {};
    return S.LIST.reduce(function (chain, item) {
      if (ids && ids.indexOf(item.id) < 0) return chain;
      return chain.then(function () {
        return render(item, false).then(function (buf) {
          var m = analyze(buf);
          out[item.id] = +(S.PEAK_TARGET / m.peak).toFixed(5);
        });
      });
    }, Promise.resolve()).then(function () { return out; });
  };


  /** 頭出しの検証用: 先頭 sec 秒のピークを返す（案5のしゃくり上げの調整に使う） */
  window.__HEAD = function (id, sec) {
    var item = S.itemById(id);
    return render(item, true).then(function (buf) {
      var L = buf.getChannelData(0), R = buf.getChannelData(1);
      var s0 = Math.round(T0 * SR), s1 = Math.min(buf.length - 1, s0 + Math.round(sec * SR));
      var full = analyze(buf);
      var h = 0, i, a;
      for (i = s0; i <= s1; i++) {
        a = Math.abs(L[i]); if (a > h) h = a;
        a = Math.abs(R[i]); if (a > h) h = a;
      }
      return { head: +h.toFixed(4), peak: +full.peak.toFixed(4), ratio: +(h / full.peak).toFixed(3), t50ms: +(full.t50 * 1000).toFixed(1), dur: +full.dur.toFixed(3) };
    });
  };

  /** 本番: 較正済みの norm でレンダ → 数値を測る → WAV をサーバへ保存
   *  ids を渡すとその id だけを処理する（既存の WAV を触らずに追加分だけ焼くため） */
  window.__RENDER_ALL = function (save, ids) {
    var out = [];
    return S.LIST.reduce(function (chain, item) {
      if (ids && ids.indexOf(item.id) < 0) return chain;
      return chain.then(function () {
        return render(item, true).then(function (buf) {
          var m = analyze(buf);
          var rec = {
            id: item.id, label: item.label,
            peak: +m.peak.toFixed(4),
            t50ms: +(m.t50 * 1000).toFixed(1),
            dur: +m.dur.toFixed(3),
            want: item.dur,
            wavSec: +((m.cut - m.s0 + 1) / SR).toFixed(3)
          };
          out.push(rec);
          if (!save) return;
          var ab = encodeWav(buf, m.s0, m.cut);
          return fetch('save/' + item.id + '.wav', {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: ab
          }).then(function (r) { rec.saved = r.status; });
        });
      });
    }, Promise.resolve()).then(function () {
      document.getElementById('log').textContent = JSON.stringify(out, null, 1);
      return out;
    });
  };

  /* ================================================================
   * P4.15 の数値判定（契約 DESIGN.md「P4.15 声の差し替え」）
   *   ピーク0.85〜0.92・クリップなし
   *   絶叫の基音推移が直線でない（1秒内に3回以上の向き変化。自己相関で追跡）
   *   種違い2レンダの波形相関 < 0.9
   *   すすり泣き区間と絶叫区間の RMS 比 >= 1:4
   * ============================================================== */

  /** 自己相関（McLeod 風の正規化）で 1 点の基音を測る */
  function f0At(d, sr, at, win, fmin, fmax) {
    var n = Math.round(win * sr), s0 = Math.round(at * sr), i, l;
    if (s0 < 0 || s0 + n + Math.ceil(sr / fmin) >= d.length) return 0;
    var mean = 0;
    for (i = 0; i < n; i++) mean += d[s0 + i];
    mean /= n;
    var lMin = Math.max(2, Math.floor(sr / fmax)), lMax = Math.ceil(sr / fmin);
    var e0 = 0;
    for (i = 0; i < n; i++) { var v = d[s0 + i] - mean; e0 += v * v; }
    if (e0 <= 1e-12) return 0;
    var r = new Float64Array(lMax + 1);
    for (l = lMin; l <= lMax; l++) {
      var num = 0, e1 = 0;
      for (i = 0; i < n; i++) {
        var a = d[s0 + i] - mean, b = d[s0 + i + l] - mean;
        num += a * b; e1 += b * b;
      }
      r[l] = (e1 > 1e-12) ? num / Math.sqrt(e0 * e1) : 0;
    }
    /* 山を拾い、最大の 0.86 倍を超える「最初の」山を採る（オクターブ誤りを避ける） */
    var best = 0, peaks = [];
    for (l = lMin + 1; l < lMax; l++) {
      if (r[l] > r[l - 1] && r[l] >= r[l + 1]) { peaks.push(l); if (r[l] > best) best = r[l]; }
    }
    if (best < 0.30) return 0;
    for (i = 0; i < peaks.length; i++) {
      l = peaks[i];
      if (r[l] >= best * 0.86) {
        /* 放物線内挿で lag を細かく */
        var y0 = r[l - 1], y1 = r[l], y2 = r[l + 1];
        var den = (y0 - 2 * y1 + y2);
        var dl = den !== 0 ? 0.5 * (y0 - y2) / den : 0;
        return sr / (l + dl);
      }
    }
    return 0;
  }

  /** 基音の列（hop 秒刻み） */
  function f0Series(d, sr, t0, t1, hop, fmin, fmax) {
    var out = [];
    for (var t = t0; t + 0.021 < t1; t += hop) out.push(f0At(d, sr, t, 0.021, fmin, fmax));
    return out;
  }

  /** 向き（上り/下り）が変わった回数。dead は無視する相対幅 */
  function turnsOf(f, dead) {
    var n = 0, dir = 0, ref = 0, i, v;
    for (i = 0; i < f.length; i++) {
      v = f[i];
      if (!(v > 0)) continue;
      if (!ref) { ref = v; continue; }
      if (v > ref) {
        if (dir < 0) { if (v > ref * (1 + dead)) { n++; dir = 1; ref = v; } }
        else { dir = 1; ref = v; }
      } else if (v < ref) {
        if (dir > 0) { if (v < ref * (1 - dead)) { n++; dir = -1; ref = v; } }
        else { dir = -1; ref = v; }
      }
    }
    return n;
  }

  function rmsIn(d, sr, t0, t1) {
    var a = Math.max(0, Math.round(t0 * sr)), b = Math.min(d.length, Math.round(t1 * sr)), s = 0;
    for (var i = a; i < b; i++) s += d[i] * d[i];
    return (b > a) ? Math.sqrt(s / (b - a)) : 0;
  }

  function corrOf(x, y) {
    var n = Math.min(x.length, y.length), sxy = 0, sxx = 0, syy = 0;
    for (var i = 0; i < n; i++) { sxy += x[i] * y[i]; sxx += x[i] * x[i]; syy += y[i] * y[i]; }
    return (sxx > 0 && syy > 0) ? sxy / Math.sqrt(sxx * syy) : 0;
  }

  /** 案5改（sobScream）の3段階を数値判定する */
  window.__P415 = function (ids) {
    var out = [];
    return (ids || []).reduce(function (chain, id) {
      return chain.then(function () {
        var item = S.itemById(id);
        var onset = (item.params.onset === undefined) ? 1.20 : item.params.onset;
        var scr = (item.params.scream === undefined) ? 1.16 : item.params.scream;
        var b2 = JSON.parse(JSON.stringify(item.params || {}));
        b2.seed = 99887766;                       /* 種だけ変えた2本目 */
        var alt = { id: item.id, voice: item.voice, params: b2, dur: item.dur, norm: item.norm };
        return render(item, true).then(function (buf) {
          return render(alt, true).then(function (buf2) {
            var L = buf.getChannelData(0), R = buf.getChannelData(1), sr = buf.sampleRate;
            var i, a, peak = 0;
            for (i = 0; i < buf.length; i++) {
              a = Math.abs(L[i]); if (a > peak) peak = a;
              a = Math.abs(R[i]); if (a > peak) peak = a;
            }
            var m = analyze(buf);
            var f = f0Series(L, sr, T0 + onset + 0.03, T0 + onset + 1.03, 0.020, 380, 1750);
            var got = 0;
            for (i = 0; i < f.length; i++) if (f[i] > 0) got++;
            var sobRms = rmsIn(L, sr, T0 + 0.02, T0 + onset - 0.02);
            var scrRms = rmsIn(L, sr, T0 + onset, T0 + onset + scr);
            var headPk = 0;
            for (i = Math.round(T0 * sr); i < Math.round((T0 + 0.30) * sr); i++) {
              a = Math.abs(L[i]); if (a > headPk) headPk = a;
              a = Math.abs(R[i]); if (a > headPk) headPk = a;
            }
            out.push({
              id: id,
              peak: +peak.toFixed(4),
              clipped: peak > 1.0,
              turns: turnsOf(f, 0.005),
              f0n: got + '/' + f.length,
              f0min: +Math.min.apply(null, f.filter(function (x) { return x > 0; })).toFixed(0),
              f0max: +Math.max.apply(null, f).toFixed(0),
              corr: +Math.abs(corrOf(buf.getChannelData(0), buf2.getChannelData(0))).toFixed(4),
              sobRms: +sobRms.toFixed(5),
              scrRms: +scrRms.toFixed(5),
              ratio: +(scrRms / Math.max(sobRms, 1e-9)).toFixed(2),
              headRatio: +(headPk / peak).toFixed(3),
              dur: +m.dur.toFixed(3),
              wavSec: +((m.cut - m.s0 + 1) / sr).toFixed(3)
            });
          });
        });
      });
    }, Promise.resolve()).then(function () {
      document.getElementById('log').textContent = JSON.stringify(out, null, 1);
      return out;
    });
  };
}());
</script>
</body>
</html>
