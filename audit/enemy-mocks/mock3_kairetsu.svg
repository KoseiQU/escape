<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#16141a"/>
      <stop offset="55%" stop-color="#0b0a0e"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>
    <linearGradient id="skin3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181a16"/>
      <stop offset="55%" stop-color="#2c3028"/>
      <stop offset="100%" stop-color="#4e564a"/>
    </linearGradient>
    <radialGradient id="faceG3" cx="48%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#e8e5d6"/>
      <stop offset="60%" stop-color="#c6c3b0"/>
      <stop offset="100%" stop-color="#7c7a6c"/>
    </radialGradient>
    <radialGradient id="wound" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a03427"/>
      <stop offset="45%" stop-color="#601a14"/>
      <stop offset="100%" stop-color="#230807"/>
    </radialGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.033" numOctaves="3" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8"/>
    </filter>
    <filter id="rough2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="redglow"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="6"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="1100" fill="url(#bg3)"/>
  <ellipse cx="400" cy="980" rx="290" ry="55" fill="#12100e" opacity="0.8" filter="url(#soft)"/>

  <!-- 胸の裂け目の赤い光が周囲へ漏れる -->
  <ellipse cx="400" cy="470" rx="120" ry="200" fill="#6b1d14" opacity="0.25" filter="url(#redglow)"/>

  <!-- 本体: 遠目には普通の人（作業服） -->
  <g filter="url(#rough)">
    <!-- 脚 -->
    <path d="M362 640 C352 730 348 820 356 900 L344 962 L386 966 C392 892 396 810 396 726 Z" fill="#1c1e1a"/>
    <path d="M440 640 C452 730 456 822 448 902 L462 962 L418 966 C412 892 408 810 408 726 Z" fill="#1c1e1a"/>
    <!-- 胴（作業服・前が裂けて開いている） -->
    <path d="M330 352 C310 420 312 520 336 610 C356 646 380 656 400 656 C348 600 336 480 352 380 Z" fill="url(#skin3)"/>
    <path d="M470 352 C492 420 490 522 466 612 C446 648 420 656 400 656 C452 600 466 480 450 380 Z" fill="url(#skin3)"/>
    <!-- 腕: だらり -->
    <path d="M330 372 C300 430 292 510 298 586 C302 650 310 704 324 748 L344 742 C332 696 326 646 324 592 C322 520 332 448 352 396 Z" fill="url(#skin3)"/>
    <path d="M470 372 C502 432 510 512 504 588 C500 652 490 706 476 750 L456 744 C468 698 474 648 476 594 C478 522 468 448 448 396 Z" fill="url(#skin3)"/>
    <path d="M328 744 C324 776 326 806 334 830 M316 748 C312 780 314 810 320 834 M342 748 C342 778 344 806 350 828" stroke="#242820" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M472 746 C476 778 474 808 466 832 M484 750 C488 782 486 812 480 836 M458 750 C458 780 456 808 450 830" stroke="#242820" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 首 -->
    <path d="M380 348 C382 322 380 300 386 282 L418 284 C416 304 416 326 418 348 Z" fill="url(#skin3)"/>
  </g>

  <!-- 胸の縦裂け: 肋骨が開く -->
  <g>
    <path d="M394 372 C376 440 372 520 386 592 C394 622 406 622 414 592 C428 520 424 440 408 372 Z" fill="url(#wound)" filter="url(#rough2)"/>
    <!-- 開いた肋骨（左右に牙のように） -->
    <g stroke="#c9c4ae" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#rough2)">
      <path d="M388 408 C366 402 350 408 340 420"/>
      <path d="M386 452 C362 448 344 456 334 470"/>
      <path d="M386 498 C362 496 346 506 338 520"/>
      <path d="M390 544 C368 544 352 554 346 568"/>
      <path d="M412 408 C434 402 450 408 460 420"/>
      <path d="M414 452 C438 448 456 456 466 470"/>
      <path d="M414 498 C438 496 454 506 462 520"/>
      <path d="M410 544 C432 544 448 554 454 568"/>
    </g>
    <!-- 裂け目の中の歯列（第二の口の気配） -->
    <path d="M396 430 L392 452 M404 428 L404 452 M412 432 L414 452 M396 500 L394 522 M406 500 L406 524 M414 502 L416 522"
          stroke="#ddd6bd" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <ellipse cx="401" cy="480" rx="26" ry="90" fill="#8c2a1d" opacity="0.5" filter="url(#redglow)"/>
    <!-- 垂れる体液 -->
    <path d="M392 600 C390 636 392 668 390 700 M410 604 C412 640 410 676 412 712" stroke="#4a1410" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 頭部: まっすぐ正面・長い髪・穏やかに笑う -->
  <g>
    <path d="M344 236 C330 330 330 440 344 528 C354 534 364 530 368 520 C356 436 356 330 368 250 Z" fill="#07080a" filter="url(#rough2)"/>
    <path d="M456 238 C472 332 472 444 458 532 C448 538 438 534 434 522 C446 438 446 332 434 252 Z" fill="#07080a" filter="url(#rough2)"/>
    <ellipse cx="400" cy="252" rx="50" ry="64" fill="url(#faceG3)"/>
    <ellipse cx="400" cy="252" rx="50" ry="64" fill="#e4e1d0" opacity="0.35" filter="url(#glow)"/>
    <!-- 目: 優しく閉じ気味の弧＝笑い目 -->
    <path d="M368 234 C376 228 390 228 396 236" stroke="#191b14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M404 236 C410 228 424 228 432 234" stroke="#191b14" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 笑い -->
    <path d="M366 280 C384 306 418 306 436 278 C424 298 412 306 400 306 C388 306 374 298 366 280 Z" fill="#1c130f"/>
    <path d="M372 286 C386 296 416 296 430 284" stroke="#d9d5bc" stroke-width="4" fill="none" opacity="0.9"/>
    <!-- 前髪 -->
    <path d="M376 194 C368 240 364 292 366 340 L374 342 C374 294 378 244 386 202 Z" fill="#060708"/>
    <path d="M420 196 C428 244 432 296 430 344 L422 344 C424 296 418 246 412 202 Z" fill="#060708"/>
  </g>

  <ellipse cx="400" cy="972" rx="140" ry="20" fill="#000" opacity="0.75" filter="url(#soft)"/>
  <rect width="800" height="1100" filter="url(#grain)" opacity="0.5" fill="none"/>

  <text x="40" y="1044" font-family="Hiragino Kaku Gothic ProN, sans-serif" font-size="26" fill="#a39a98">案③ 開裂型</text>
  <text x="40" y="1076" font-family="Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#675d5c">遠目には人間・巡回中は裂け目が閉じている／追跡モードで胸が縦に裂け肋骨が開く／顔は最後まで穏やかに笑ったまま</text>
</svg>
